name: KB responder

# Ticket deflection. A question-labelled issue gets answered from docs/ and closed
# without a human touching it. Anything it can't answer fully — including change
# requests — stays open for a human.

# Runs once per question: when the `question` label is added — at creation or later.
# (Creating an issue with several labels fires one `labeled` event per label, plus
# `opened`; reacting to all of them would answer the same issue several times.)
on:
  issues:
    types: [labeled]

concurrency:
  group: kb-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: read

jobs:
  answer:
    if: github.event.label.name == 'question'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for API key
        id: key
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Forks do not inherit secrets. Say so clearly instead of failing red.
      - name: Explain missing key
        if: steps.key.outputs.present == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '🔑 **No `ANTHROPIC_API_KEY` secret is set on this fork, so I can\'t answer.**',
                '',
                'Add one in *Settings → Secrets and variables → Actions → New repository secret*,',
                'name it `ANTHROPIC_API_KEY`, paste the workshop key, then re-apply the',
                '`question` label to re-run me.',
              ].join('\n')
            })

      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: '3.11'

      - name: Install
        if: steps.key.outputs.present == 'true'
        run: pip install -q -r requirements.txt

      - name: Answer from the knowledge base
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/bot.py answer-issue --title "$ISSUE_TITLE" --body "$ISSUE_BODY" > answer.md
          cat answer.md

      - name: Post the answer
        if: steps.key.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('answer.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
            // Deflected means answered end to end. Anything else stays open
            // for a human -- the bot is not allowed to close what it guessed at.
            if (body.includes('DEFLECTED: yes')) {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['deflected'],
              });
              await github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                state_reason: 'completed',
              });
            }

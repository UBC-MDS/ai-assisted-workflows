  gold_sql: SELECT s.Region, ROUND(SUM((i.Subtotal - COALESCE(rf.Refunded, 0)) * x.RateToUSD), 2) FROM Invoice i JOIN Customer c ON c.CustomerId = i.CustomerId JOIN Store s ON s.StoreId = i.StoreId JOIN ExchangeRate x ON x.CurrencyCode = i.CurrencyCode AND x.Month = strftime('%Y-%m', i.InvoiceDate) LEFT JOIN (SELECT InvoiceId, SUM(RefundAmount) AS Refunded FROM Refund GROUP BY InvoiceId) rf ON rf.InvoiceId = i.InvoiceId WHERE i.InvoiceStatus = 'settled' AND c.AccountType NOT IN ('internal', 'test') AND (s.AcquiredDate IS NULL OR i.InvoiceDate >= s.AcquiredDate) AND i.InvoiceDate BETWEEN '2024-10-01' AND '2024-12-31' GROUP BY 1

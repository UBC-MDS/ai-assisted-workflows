- id: cat-18
  category: catalog
  question: Which genre sold the most units in calendar 2025? Return just the genre name.
  gold_sql: SELECT g.Name FROM InvoiceLine il JOIN Invoice i ON i.InvoiceId = il.InvoiceId JOIN Track t ON t.TrackId = il.TrackId JOIN Genre g ON g.GenreId = t.GenreId WHERE i.InvoiceStatus = 'settled' AND i.InvoiceDate BETWEEN '2025-01-01' AND '2025-12-31' GROUP BY g.Name ORDER BY SUM(il.Quantity) DESC LIMIT 1
- id: cat-19
  category: catalog
  question: Which 5 artists sold the most units in calendar 2024? Return the artist name and the units.
  gold_sql: SELECT ar.Name, SUM(il.Quantity) FROM InvoiceLine il JOIN Invoice i ON i.InvoiceId = il.InvoiceId JOIN Track t ON t.TrackId = il.TrackId JOIN Album al ON al.AlbumId = t.AlbumId JOIN Artist ar ON ar.ArtistId = al.ArtistId WHERE i.InvoiceStatus = 'settled' AND i.InvoiceDate BETWEEN '2024-01-01' AND '2024-12-31' GROUP BY ar.Name ORDER BY 2 DESC LIMIT 5
- id: cat-20
  category: catalog
  question: How many units did we sell per media type in calendar 2025? Return the media type name and the units.
  gold_sql: SELECT mt.Name, SUM(il.Quantity) FROM InvoiceLine il JOIN Invoice i ON i.InvoiceId = il.InvoiceId JOIN Track t ON t.TrackId = il.TrackId JOIN MediaType mt ON mt.MediaTypeId = t.MediaTypeId WHERE i.InvoiceStatus = 'settled' AND i.InvoiceDate BETWEEN '2025-01-01' AND '2025-12-31' GROUP BY mt.Name
- id: cat-21
  category: catalog
  question: What is the average track length in minutes, to one decimal place? Return a single number.
